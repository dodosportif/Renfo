<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan Coureur</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concept : calendrier mensuel en haut, fiche de séance dessous, lecteur plein écran en cercle de compte à rebours. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --fg:#1b2233; --muted:#667085; --line:#dfe4ee;
  --p30:#3f51b5; --p30-soft:#e4e8fb; --semi:#d9480f; --semi-soft:#fde8dd;
  --ok:#2e7d32; --work:#2447c9; --rest:#0b7a75; --trans:#b45309; --on:#ffffff;
  --font:'Inter',system-ui,sans-serif; --head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b202c; --fg:#eceff6; --muted:#9aa3b5; --line:#2b3242;
  --p30:#8c9bff; --p30-soft:#262c4d; --semi:#ff9a62; --semi-soft:#4a2c1d;
  --ok:#7bd88a; --work:#3556e0; --rest:#12948d; --trans:#c46a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b202c; --fg:#eceff6; --muted:#9aa3b5; --line:#2b3242;
  --p30:#8c9bff; --p30-soft:#262c4d; --semi:#ff9a62; --semi-soft:#4a2c1d;
  --ok:#7bd88a; --work:#3556e0; --rest:#12948d; --trans:#c46a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 22px var(--head);margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--font);padding:9px 6px;border-radius:9px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font:700 16px var(--head);text-transform:capitalize}
.nav{border:1px solid var(--line);background:none;color:var(--fg);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{position:relative;aspect-ratio:1/1;border:1px solid transparent;border-radius:10px;background:none;color:var(--fg);font:500 14px var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.day.out{color:var(--muted);opacity:.4}
.day.today{border-color:var(--fg)}
.day.sel{background:var(--fg);color:var(--bg)}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.p30{background:var(--p30)}.dot.semi{background:var(--semi)}
.dot.done{background:var(--ok)}.dot.sq{border-radius:2px}
.bloc{border-top:1px solid var(--line);padding:9px 0;font-size:14px;display:flex;flex-direction:column;gap:3px}.bloc b{font-weight:600}.bloc small{color:var(--muted);font-size:13px;line-height:1.4}
.keyb{background:var(--p30-soft);color:var(--fg);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.45}
.chk{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:none;color:var(--fg);border-radius:12px;padding:13px 14px;font:700 15px var(--font);cursor:pointer;text-align:left}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;flex:none}
.chk[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.chk[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.day.sel .dot{outline:1.5px solid var(--bg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ctop h2{font:700 18px var(--head);margin:0}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.p30{background:var(--p30-soft);color:var(--p30)}.pill.semi{background:var(--semi-soft);color:var(--semi)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg)}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ex li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ex li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 16px;font:700 15px var(--font);cursor:pointer;flex:1;min-width:130px}
.btn.main{background:var(--fg);color:var(--bg)}
.btn.alt{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.okb{background:var(--ok);color:#fff}
.empty{color:var(--muted);font-size:14px;margin:0}
.next{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;cursor:pointer;width:100%;text-align:left;color:var(--fg);font-family:var(--font)}
.nrow small{color:var(--muted)}
:focus-visible{outline:3px solid var(--p30);outline-offset:2px}
/* lecteur */
#player{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;color:var(--on);background:var(--work);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:background .25s}
#player.on{display:flex}
#player.rest{background:var(--rest)}#player.trans{background:var(--trans)}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;opacity:.92}
.pq{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:9px 14px;font:600 14px var(--font);cursor:pointer}
.pbar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin:14px 0 0;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;width:0}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:0}
.kind{font:700 13px var(--font);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.pname{font:700 clamp(26px,8vw,38px)/1.1 var(--head);margin:0;text-wrap:balance}
.count{font:700 clamp(90px,34vw,150px)/1 var(--head);font-variant-numeric:tabular-nums;margin:0}
.cue{font-size:16px;line-height:1.4;max-width:34ch;opacity:.95;margin:0}
.pnext{font-size:14px;opacity:.9;text-align:center;margin-bottom:12px;min-height:20px}
.pctl{display:flex;gap:10px}
.pctl button{flex:1;border:0;border-radius:14px;padding:16px 8px;font:700 16px var(--font);cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
.pctl button.big{background:#fff;color:#1b2233;flex:1.6}
#done{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--fg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#done.on{display:flex}
#done h2{font:700 30px var(--head);margin:0}
@media (prefers-reduced-motion:reduce){#player{transition:none}}
</style>

</head><body>
<div class="wrap">
  <div><h1>Plan Coureur</h1><p class="sub">Courses et renfo · 25 nov 2026 → 21 mars 2027</p><p class="sub" id="prog" style="margin-top:6px"></p></div>

</div>

<div id="player" role="dialog" aria-label="Séance en cours">

</div>

<script>
/* ---------- données ---------- */
const P = (base, cue, t) => [[base + ' droit', cue, t], [base + ' gauche', cue, t]];

3–4", "Z3–Z4", "Allure semi-marathon 5'37/km (≈ 10,7 km/h). Doit être « confortablement difficile », respiration rythmée. Récup : trot lent 3 min. Si FC > Z4 haute, ralentis de 5–10 s/km."], ["🌿 Retour calme", "7–10 min · Zone 1–2", "", "Trot très lent puis marche · étirements soléaire, gastrocnémiens, ischio-jambiers"]], "key": "Affûtage : volume −55 %, qualité conservée mais courte. Mardi, jeudi, puis 20 min samedi. Dimanche 21/03 = SEMI."}, {"prog": "semi", "date": "2027-03-20", "title": "VEILLE DE COURSE — 20 MIN + LIGNES DROITES", "info": "📅 Samedi 20/03/2027  ·  Affûtage  ·  20 min  ·  D+ libre ≤150 m  ·  Zone 2", "desc": "Séance d'activation pour le semi de demain : jambes légères, pas de fatigue. 20 min très faciles + 4 lignes droites. Tu dois finir avec envie d'en faire plus.", "blocs": [["🔥 Échauffement", "5 min · Zone 1", "", "Marche rapide 3 min + mobilité hanches / chevilles 2 min (non compté dans la durée)"], ["🏃 Footing Z2", "16 min · Zone 2", "", "Course continue, allure conversation facile (~6'20–6'50/km) · FC Zone 2 · cadence ~180 ppm, médio-pied, bras avant-arrière, regard loin · terrain plat ou vallonné doux (≤150 m D+) · boire à la demande"], ["⚡ Lignes droites", "4 × 15–20 s", "Z4 (court)", "Accélération progressive à ~5'20/km, relâché. Récup 45 s marche. Rien de plus."], ["🌿 Retour calme", "3 min · Zone 1", "", "Marche · étirements soléaire, gastrocnémiens, ischio-jambiers (non compté)"]], "key": "Veille de course : 20 min très faciles + 4 lignes droites, jambes légères. Prépare ton sac, dossard, gel, boisson. Coucher tôt."}, {"prog": "semi", "date": "2027-03-21", "title": "SEMI-MARATHON — 21,1 KM — OBJECTIF < 2 H", "info": "📅 Dimanche 21/03/2027  ·  JOUR J  ·  objectif 1 h 58 min 30 s  ·  allure 5'37/km  ·  Zones 3–4", "desc": "Le jour J. Départ prudent (5'42 sur les 5 premiers km), croisière à 5'37, relance éventuelle sur les 6 derniers kilomètres. 2 h = 5'41/km : ton plan te laisse 1 min 30 s de marge. Si les mollets ou les tendons d'Achille alertent (> 4/10), ralentis plutôt que d'abandonner.", "blocs": [["🔥 Échauffement", "15 min", "Zone 1–2", "Footing très lent 8 min + gammes + 3 lignes droites, finir 10 min avant le départ. Gel 15 min avant."], ["🏃 0 → 5 km", "28'30 · 5'42/km", "Zone 3", "Départ PRUDENT : tu dois te sentir « trop facile ». Ne te laisse pas emporter par la foule. Cadence 180 ppm."], ["🎯 5 → 15 km", "56'10 · 5'37/km", "Zone 3–4", "Régime de croisière : allure régulière, 150 ml d'eau à chaque ravito, 1 gel au 8e et au 15e km."], ["🔥 15 → 19 km", "22'20 · 5'35/km", "Zone 4", "Si les jambes répondent : maintiens, légère accélération possible. Sinon garde 5'37 sans te mettre en danger."], ["🏁 19 → 21,1 km", "≈ 11'30 · 5'30/km", "Zone 4–5", "Donne tout ce qui reste. Objectif : 1 h 58 min 30 s, soit 1 min 30 s de marge sous les 2 h."]], "key": "🏁 Objectif : < 2 h. Plan B si journée difficile : finir en < 2 h 05 sans douleur. Vide l'estomac, 1 gel tous les 40 min, bois à chaque ravito."}];
RUNS.forEach(r => SESS.push(Object.assign({kind:'run', type:'R', min: /SEMI-MARATHON/.test(r.title) ? 119 : +((/(\d+) min/.exec(r.info)||[0,0])[1])}, r)));
SESS.forEach(s => s.id = s.prog+'-'+s.date+'-'+s.type);
SESS.sort((a,b) => a.date.localeCompare(b.date));
const PROG = {p30:{name:'Objectif 5×30 min', cls:'p30'}, semi:{name:'Semi 21 mars', cls:'semi'}};

/* ---------- état ---------- */
let doneMap = {};
try { doneMap = JSON.parse(localStorage.getItem('renfo-done') || '{}'); } catch(e) {}
const saveDone = () => { try { localStorage.setItem('renfo-done', JSON.stringify(doneMap)); } catch(e) {} };
let filter = 'all', kfilter = 'all', sel = null;
const today = iso(new Date());
const visible = () => SESS.filter(s => (filter==='all' || s.prog===filter) && (kfilter==='all' || s.kind===kfilter));
const first = visible().find(s => s.date >= today) || SESS[0];
let view = new Date((first.date)+'T12:00:00'); view.setDate(1);
sel = first.date;

const $ = id => document.getElementById(id);
const fmtLong = s => new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
const stepsFor = s => {
  const list = s.type==='A' ? A_LIST : B_LIST, rest = s.type==='A' ? REST_A : REST_B, st = [];
  st.push({k:'trans', dur:TRANS, name:'Prépare-toi', cue:'Place-toi pour : '+list[0][0], round:1});
  for (let r=1; r<=s.rounds; r++) {
    list.forEach((e,i) => {
      st.push({k:'work', dur:e[2][s.phase], name:e[0], cue:e[1], round:r, idx:i+1, tot:list.length});
      const last = i===list.length-1;
      if (!last) st.push({k:'trans', dur:TRANS, name:'Change de position', cue:'Prochain : '+list[i+1][0], round:r});
    });
    if (r<s.rounds) st.push({k:'rest', dur:rest, name:'Repos entre les tours', cue:'Tour '+(r+1)+' : '+list[0][0], round:r});
  }
  return st;
};
const totalMin = s => s.kind==='run' ? s.min :  Math.round(stepsFor(s).reduce((a,x)=>a+x.dur,0)/60);

/* ---------- calendrier ---------- */
['L','M','M','J','V','S','D'].forEach(d => { const e=document.createElement('div'); e.className='dow'; e.textContent=d; $('dows').appendChild(e); });
function renderCal() {
  $('mlabel').textContent = view.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
  const g = $('days'); g.innerHTML = '';
  const y = view.getFullYear(), m = view.getMonth();
  const offset = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate();
  for (let i=0; i<offset; i++) g.appendChild(document.createElement('div'));
  for (let d=1; d<=n; d++) {
    const ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const b = document.createElement('button'); b.className = 'day'+(ds===today?' today':'')+(ds===sel?' sel':'');
    b.setAttribute('aria-label', fmtLong(ds));
    b.innerHTML = '<span>'+d+'</span><span class="dots"></span>';
    visible().filter(s=>s.date===ds).forEach(s => { const dot=document.createElement('span'); dot.className='dot '+(doneMap[s.id]?'done':PROG[s.prog].cls)+(s.kind==='renfo'?' sq':''); b.lastChild.appendChild(dot); });
    b.onclick = () => { sel = ds; renderCal(); renderDetail(); };
    g.appendChild(b);
  }
}
function exList(s) {
  const list = s.type==='A' ? A_LIST : B_LIST;
  return '<ul class="ex">'+list.map(e=>'<li><span>'+e[0]+'</span><span>'+e[2][s.phase]+' s</span></li>').join('')+'</ul>';
}
function renderDetail() {
  const box = $('detail'); box.innerHTML = '';
  const ss = visible().filter(s=>s.date===sel);
  if (!ss.length) { box.innerHTML = '<div class="card"><b style="text-transform:capitalize">'+fmtLong(sel)+'</b><p class="empty">Pas de renfo ce jour. Choisis un jour avec un point coloré, ou lance une séance dans « Prochaines séances ».</p></div>'; return; }
  ss.forEach(s => {
    const c = document.createElement('div'); c.className='card';
    if (s.kind==='run') { runCard(c, s); box.appendChild(c); return; }
    const rest = s.type==='A'?REST_A:REST_B;
    c.innerHTML = '<div class="ctop"><div><div class="sub" style="text-transform:capitalize">'+fmtLong(s.date)+'</div><h2>Renfo '+s.type+' — '+(s.type==='A'?'circuit complet':'circuit court')+'</h2></div><span class="pill '+PROG[s.prog].cls+'">'+PROG[s.prog].name+'</span></div>'
      +'<div class="meta"><span>Circuit <b>≈ '+totalMin(s)+' min</b> (+ 8 min échauffement et étirements)</span><span>Tours <b>'+s.rounds+'</b></span><span>Repos entre tours <b>'+rest+' s</b></span><span>Transition <b>'+TRANS+' s</b></span></div>'
      + exList(s)
      + (s.rounds===1 ? '<p class="empty">Semaine d’affûtage : un seul tour.</p>' : '')
      + '<div class="btns"><button class="btn main" data-go>▶ Lancer la séance</button></div>';
    c.querySelector('[data-go]').onclick = () => start(s);
    c.appendChild(chkBtn(s));
    box.appendChild(c);
  });
}
function chkBtn(s) {
  const b = document.createElement('button'); b.className='chk'; b.setAttribute('aria-pressed', !!doneMap[s.id]);
  b.innerHTML = '<span class="box">✔</span><span>'+(doneMap[s.id]?'Séance faite':'Marquer comme faite')+'</span>';
  b.onclick = () => { doneMap[s.id] ? delete doneMap[s.id] : doneMap[s.id]=true; saveDone(); renderAll(); };
  return b;
}
function runCard(c, s) {
  const esc = t => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  c.innerHTML = '<div class="ctop"><div><div class="sub" style="text-transform:capitalize">'+fmtLong(s.date)+'</div><h2>'+esc(s.title)+'</h2></div><span class="pill '+PROG[s.prog].cls+'">'+PROG[s.prog].name+'</span></div>'
    +'<p class="empty" style="color:var(--fg)">'+esc(s.desc)+'</p>'
    + s.blocs.map(b=>'<div class="bloc"><b>'+esc(b[0])+' · '+esc(b[1])+(b[2]?' · '+esc(b[2]):'')+'</b><small>'+esc(b[3])+'</small></div>').join('')
    + '<div class="keyb">'+esc(s.key)+'</div>';
  c.appendChild(chkBtn(s));
}
function renderProgress() {
  const all = SESS.filter(s => s.date <= '2027-03-21'), d = all.filter(s => doneMap[s.id]).length;
  $('prog').textContent = d+' / '+all.length+' séances faites';
}
function renderUpcoming() {
  const u = $('upcoming'); u.innerHTML = '';
  visible().filter(s=>s.date>=today && !doneMap[s.id]).slice(0,5).forEach(s => {
    const b = document.createElement('button'); b.className='nrow';
    b.innerHTML = '<span><b style="text-transform:capitalize">'+new Date(s.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+'</b> · '+(s.kind==='run'?'Course':'Renfo '+s.type)+'<br><small>'+PROG[s.prog].name+' · ≈ '+totalMin(s)+' min</small></span><span class="pill '+PROG[s.prog].cls+'">Voir</span>';
    b.onclick = () => { sel=s.date; view=new Date(s.date+'T12:00:00'); view.setDate(1); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    u.appendChild(b);
  });
  if (!u.children.length) u.innerHTML = '<p class="empty">Aucune séance à venir.</p>';
}
function renderAll() { renderCal(); renderDetail(); renderUpcoming(); renderProgress(); }
['all','run','renfo'].forEach(k => $('k-'+k).onclick = () => { kfilter=k; ['all','run','renfo'].forEach(x=>$('k-'+x).setAttribute('aria-pressed', x===k)); renderAll(); });
$('prev').onclick = () => { view.setMonth(view.getMonth()-1); renderCal(); };
$('next').onclick = () => { view.setMonth(view.getMonth()+1); renderCal(); };
['all','p30','semi'].forEach(f => $('f-'+f).onclick = () => { filter=f; ['all','p30','semi'].forEach(x=>$('f-'+x).setAttribute('aria-pressed', x===f)); renderAll(); });

/* ---------- lecteur ---------- */
let cur=null, steps=[], si=0, endAt=0, left=0, paused=false, tick=null, wake=null, ac=null, lastBeep=-1;
function beep(f=880, ms=140) {
  try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f; o.connect(g); g.connect(ac.destination); g.gain.value=.2; o.start(); o.stop(ac.currentTime+ms/1000); } catch(e) {}
  try { navigator.vibrate && navigator.vibrate(ms); } catch(e) {}
}
async function lock() { try { wake = await navigator.wakeLock.request('screen'); } catch(e) {} }
function unlock() { try { wake && wake.release(); } catch(e) {} wake=null; }
function start(s) {
  cur=s; steps=stepsFor(s); si=0; paused=false; $('ppause').textContent='Pause';
  $('player').classList.add('on'); document.body.style.overflow='hidden'; lock(); beep(660,100);
  go(0);
}
function go(i) {
  si = Math.max(0, i);
  if (si >= steps.length) return finish();
  const st = steps[si]; left = st.dur; endAt = Date.now()+left*1000; lastBeep=-1;
  const p = $('player'); p.className = 'on '+st.k;
  $('pkind').textContent = st.k==='work' ? 'Exercice '+st.idx+' / '+st.tot+' · Tour '+st.round+' / '+cur.rounds : (st.k==='rest' ? 'Repos' : 'Transition');
  $('pname').textContent = st.name; $('pcue').textContent = st.cue;
  const nx = steps.slice(si+1).find(x=>x.k==='work');
  $('pnext').textContent = st.k==='work' ? (steps[si+1] ? 'Ensuite : '+(steps[si+1].k==='work'?steps[si+1].name:steps[si+1].cue.replace(/^Prochain : |^Tour \d+ : |^Place-toi pour : /,'')) : 'Dernier exercice') : '';
  $('pinfo').textContent = 'Renfo '+cur.type+' · '+PROG[cur.prog].name;
  $('pbar').style.width = (si/steps.length*100)+'%';
  show(); clearInterval(tick); tick=setInterval(loop,200);
  if (st.k==='work') beep(990,220);
}
function show() { $('pcount').textContent = Math.max(0, Math.ceil(left)); }
function loop() {
  if (paused) return;
  left = (endAt-Date.now())/1000; show();
  const c = Math.ceil(left);
  if (c<=3 && c>0 && c!==lastBeep) { lastBeep=c; beep(700,90); }
  if (left<=0) go(si+1);
}
function finish() {
  clearInterval(tick); $('player').classList.remove('on'); unlock(); document.body.style.overflow=''; beep(1200,400);
  $('dsub').textContent = 'Renfo '+cur.type+' · '+fmtLong(cur.date); $('done').classList.add('on');
}
function quit() { clearInterval(tick); $('player').classList.remove('on'); unlock(); document.body.style.overflow=''; }
$('pquit').onclick = quit;
$('ppause').onclick = () => { if (paused) { paused=false; endAt=Date.now()+left*1000; $('ppause').textContent='Pause'; } else { paused=true; $('ppause').textContent='Reprendre'; } };
$('pskip').onclick = () => go(si+1);
$('pback').onclick = () => go(left < steps[si].dur-3 ? si : si-1);
$('dmark').onclick = () => { doneMap[cur.id]=true; saveDone(); $('done').classList.remove('on'); renderAll(); };
$('dclose').onclick = () => $('done').classList.remove('on');
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('player').classList.contains('on')) lock(); });
renderAll();
</script>
